---
services:
  database:
    image: "zulip/zulip-postgresql:14"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "zulip"
      POSTGRES_USER: "zulip"
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES}"          # ← direct magic var (Coolify generates)
    volumes:
      - "postgresql-14:/var/lib/postgresql/data:rw"
    attach: false

  memcached:
    image: "memcached:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:${MEMCACHED_PASSWORD}" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:${MEMCACHED_PASSWORD}" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    environment:
      SASL_CONF_PATH: "/home/memcache/memcached.conf"
      MEMCACHED_SASL_PWDB: "/home/memcache/memcached-sasl-db"
      MEMCACHED_PASSWORD: "${SERVICE_PASSWORD_MEMCACHED}"         # ← direct
    attach: false

  rabbitmq:
    image: "rabbitmq:4.2"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        export RABBITMQ_DEFAULT_PASS="${RABBITMQ_DEFAULT_PASS}"
        echo 'default_user = $${RABBITMQ_DEFAULT_USER}' >> /etc/rabbitmq/rabbitmq.conf
        echo 'default_pass = $${RABBITMQ_DEFAULT_PASS}' >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: "zulip"
      RABBITMQ_DEFAULT_PASS: "${SERVICE_PASSWORD_RABBITMQ}"       # ← direct
    volumes:
      - "rabbitmq:/var/lib/rabbitmq:rw"
    attach: false

  redis:
    image: "redis:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "${REDIS_PASSWORD}"'
    environment:
      REDIS_PASSWORD: "${SERVICE_PASSWORD_REDIS}"                 # ← direct
    volumes:
      - "redis:/data:rw"
    attach: false

  zulip:
    image: "zulip/docker-zulip:11.5-0"
    restart: unless-stopped
    # build:
    #   context: .
    # ports: removed (Traefik proxy)
    environment:
      # Proxy settings
      DISABLE_HTTPS: "True"
      LOADBALANCER_IPS: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"

      # Connections
      # SETTING_REMOTE_POSTGRES_HOST: "database"
      DB_HOST: database
      DB_HOST_PORT: '5432'
      DB_USER: zulip
      SETTING_MEMCACHED_LOCATION: "localhost:11211"
      SETTING_RABBITMQ_HOST: "rabbitmq"
      SETTING_REDIS_HOST: "redis"

      # Secrets for Zulip (entrypoint reads these)
      SECRETS_postgres_password: "${SERVICE_PASSWORD_POSTGRES}"
      SECRETS_memcached_password: "${SERVICE_PASSWORD_MEMCACHED}"
      SECRETS_rabbitmq_password: "${SERVICE_PASSWORD_RABBITMQ}"
      SECRETS_redis_password: "${SERVICE_PASSWORD_REDIS}"
      SECRETS_secret_key: "${SERVICE_BASE64_32}"
      SETTING_EXTERNAL_HOST: "${SERVICE_FQDN_ZULIP}"
      SETTING_ZULIP_ADMINISTRATOR: "admin@heal-digital.com"

    volumes:
      - "zulip:/data:rw"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    depends_on:
      - database
      - memcached
      - rabbitmq
      - redis

volumes:
  zulip:
  postgresql-14:
  rabbitmq:
  redis: