---
services:
  database:
    image: "zulip/zulip-postgresql:14"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "zulip"
      POSTGRES_USER: "zulip"
      POSTGRES_PASSWORD: "WLsA5fwJ3bXbAwV0Ce0ql153Awe7GQpC"
    volumes:
      - "postgresql-14:/var/lib/postgresql/data:rw"
    attach: false

  memcached:
    image: "memcached:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:${MEMCACHED_PASSWORD}" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:${MEMCACHED_PASSWORD}" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    environment:
      SASL_CONF_PATH: "/home/memcache/memcached.conf"
      MEMCACHED_SASL_PWDB: "/home/memcache/memcached-sasl-db"
      MEMCACHED_PASSWORD: "ue16lAs9PVsxMSBaJSRxEH8o9K0pUUxW"         # ← direct
    attach: false

  rabbitmq:
    image: "rabbitmq:4.2"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        export RABBITMQ_DEFAULT_PASS="${RABBITMQ_DEFAULT_PASS}"
        echo 'default_user = $${RABBITMQ_DEFAULT_USER}' >> /etc/rabbitmq/rabbitmq.conf
        echo 'default_pass = $${RABBITMQ_DEFAULT_PASS}' >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: "zulip"
      RABBITMQ_DEFAULT_PASS: "sMLHg8rOKrTYAfyyC1gVMxYfHXQ2L0n1"       # ← direct
    volumes:
      - "rabbitmq:/var/lib/rabbitmq:rw"
    attach: false

  redis:
    image: "redis:alpine"
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "${REDIS_PASSWORD}"'
    environment:
      REDIS_PASSWORD: "OgyPTPi88HjcdvH2DYYjMn00Rj5QZ7qL"                 # ← direct
    volumes:
      - "redis:/data:rw"
    attach: false

  zulip:
    image: "zulip/docker-zulip:11.5-0"
    restart: unless-stopped
    # build:
    #   context: .
    # ports: removed (Traefik proxy)
    environment:
      # Proxy settings
      DISABLE_HTTPS: "True"
      LOADBALANCER_IPS: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"

      # Connections
      # SETTING_REMOTE_POSTGRES_HOST: "127.0.0.1"
      DB_HOST: database
      DB_HOST_PORT: '5432'
      DB_USER: zulip
      SETTING_MEMCACHED_LOCATION: "localhost:11211"
      SETTING_RABBITMQ_HOST: "127.0.0.1"
      SETTING_REDIS_HOST: "127.0.0.1"

      # Secrets for Zulip (entrypoint reads these)
      SECRETS_postgres_password: "WLsA5fwJ3bXbAwV0Ce0ql153Awe7GQpC"
      SECRETS_memcached_password: "ue16lAs9PVsxMSBaJSRxEH8o9K0pUUxW"
      SECRETS_rabbitmq_password: "sMLHg8rOKrTYAfyyC1gVMxYfHXQ2L0n1"
      SECRETS_redis_password: "OgyPTPi88HjcdvH2DYYjMn00Rj5QZ7qL"
      SECRETS_secret_key: "a_very_long_random_string_at_least_50_chars_please_change_this"
      SETTING_EXTERNAL_HOST: "${SERVICE_FQDN_ZULIP}"
      SETTING_ZULIP_ADMINISTRATOR: "admin@heal-digital.com"
      SETTING_EMAIL_BACKEND: 'django.core.mail.backends.console.EmailBackend'

    volumes:
      - "zulip:/data:rw"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    depends_on:
      - database
      - memcached
      - rabbitmq
      - redis

volumes:
  zulip:
  postgresql-14:
  rabbitmq:
  redis: